# FlightsMojo self-hosted Chatwoot (https://github.com/chatwoot/chatwoot)
# Based on the official docker-compose.production.yaml.
#
# Four containers work together:
#   rails    — the Chatwoot app itself (web UI + API + widget) on port 3001
#   sidekiq  — background worker (emails, webhooks, scheduled jobs)
#   postgres — the database: every account, conversation, and message lives here
#   redis    — fast in-memory store: job queue + realtime pub/sub live here
#
# All passwords/secrets come from .env (gitignored). Copy .env.example → .env
# and fill it in if setting up fresh.

services:
  base: &base
    # FlightsMojo-branded Chatwoot CE, built by the fork's CI
    # (github.com/mishraadityan09/chatwoot, branch flightsmojo).
    # Pinned tag = deliberate upgrades only; bump -fmN per fork change.
    image: ghcr.io/mishraadityan09/chatwoot:v4.16.0-fm1
    # Image is built amd64-only (matches prod EC2). This makes Apple-Silicon
    # staging pull it anyway and run via Rosetta; no-op on Intel hosts.
    platform: linux/amd64
    env_file: .env
    volumes:
      # Uploaded files (avatars, attachments) persist here across restarts.
      - storage_data:/app/storage

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      # Host port 3001 (3000 is taken by the Next.js dev server).
      # 127.0.0.1 = only this machine can reach it.
      - '127.0.0.1:3001:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    # pgvector = standard Postgres 16 + vector-search extension
    # (Chatwoot uses it for its AI/search features).
    image: pgvector/pgvector:pg16
    restart: always
    env_file: .env
    ports:
      # Exposed on localhost only so you can poke at the DB with psql while learning.
      - '127.0.0.1:5432:5432'
    volumes:
      # THIS is where your data actually lives. The container is disposable;
      # this named volume is not. Deleting it = losing all conversations.
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    ports:
      # Exposed on localhost only so you can explore with redis-cli while learning.
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data

  bot:
    # Our own AI support bot (bot/ folder) — receives Chatwoot agent-bot
    # webhooks and replies via Gemini. See bot/server.js for the full story.
    build: ./bot
    env_file: .env
    restart: always
    depends_on:
      - rails
    ports:
      # localhost-only, handy for curl debugging (rails reaches it as bot:3002)
      - '127.0.0.1:3002:3002'

volumes:
  storage_data:
  postgres_data:
  redis_data:
